services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobintel
      POSTGRES_PASSWORD: jobintel
      POSTGRES_DB: jobintel
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobintel"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg2://jobintel:jobintel@db:5432/jobintel
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8000 }
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  pgdata:
